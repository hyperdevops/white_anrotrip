name: Deploy to VPS

on:
  push:
    branches: [main, main-design-green]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Build & push Docker image ──────────────────────────────────────────
      # Встроенный GITHUB_TOKEN (не нужен отдельный GHCR_TOKEN), см. permissions выше.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          TAG=sha-${{ github.sha }}
          docker build -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository }} --all-tags

      # ── Deploy on VPS via SSH ──────────────────────────────────────────────
      - name: Deploy to Aeza VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/deploy/anrotrip

            # Обновить образ и перезапустить контейнер
            IMAGE_TAG=sha-${{ github.sha }} \
            GITHUB_REPOSITORY=${{ github.repository }} \
              docker compose pull app

            IMAGE_TAG=sha-${{ github.sha }} \
            GITHUB_REPOSITORY=${{ github.repository }} \
              docker compose up -d

            # Удалить старые образы
            docker image prune -f
