name: Deploy to VPS

on:
  push:
    branches: [main, main-design-green]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to VPS after build?'
        required: true
        default: 'false'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read
  packages: write

jobs:
  # ── Шаг 1: Сборка и push образа в GHCR ──────────────────────────────────
  # Запускается при каждом push в main.
  # VPS не нужен — образ всегда актуален в реестре.
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          TAG=sha-${{ github.sha }}
          docker build -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository }} --all-tags

  # ── Шаг 2: Деплой на VPS ─────────────────────────────────────────────────
  # Запускается ТОЛЬКО вручную через Actions → Run workflow → deploy: true.
  # Требует: SSH_HOST и SSH_PRIVATE_KEY в GitHub Secrets.
  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true' }}

    steps:
      - name: Deploy to Aeza VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/deploy/anrotrip

            IMAGE_TAG=sha-${{ github.sha }} \
            GITHUB_REPOSITORY=${{ github.repository }} \
              docker compose pull app

            IMAGE_TAG=sha-${{ github.sha }} \
            GITHUB_REPOSITORY=${{ github.repository }} \
              docker compose up -d

            docker image prune -f
